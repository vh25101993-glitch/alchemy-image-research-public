name: Materialize verified chemistry images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-verified-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests
      - name: Download and normalize verified images
        run: |
          python - <<'PY'
          import io, json, hashlib, time
          from pathlib import Path
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageOps

          entries = {
            'baso4': 'File:Baryte (BaSO4) (13401293814).jpg',
            'cacl2': 'File:Calcium chloride CaCl2.jpg',
            'cao': 'File:Calcium oxide.JPG',
            'caso4': 'File:Anhydrite HMNH1.jpg',
            'cuo': 'File:Copper(II) oxide sample.jpg',
            'fes2': 'File:Pyrite Pyrit FeS2.jpg',
            'feso4': 'File:FeSO4 (раствор железного купороса).jpg',
            'hgs': 'File:Cinnabar (HgS).jpg',
            'pbi2': 'File:Lead(II) iodide.JPG'
          }

          UA = 'HoaHocAlchemyImageResearch/1.0 (https://github.com/vh25101993-glitch/alchemy-image-research-public; contact: vh25101993@gmail.com)'
          retry = Retry(
              total=8,
              connect=5,
              read=5,
              status=8,
              backoff_factor=4,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset(['GET']),
              respect_retry_after_header=True,
              raise_on_status=False,
          )
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept': 'application/json,image/*,*/*;q=0.8'})
          session.mount('https://', HTTPAdapter(max_retries=retry))

          def resolve_image(file_title):
              params = {
                  'action': 'query',
                  'format': 'json',
                  'formatversion': '2',
                  'prop': 'imageinfo',
                  'iiprop': 'url|size|mime',
                  'iiurlwidth': '1200',
                  'titles': file_title,
              }
              r = session.get('https://commons.wikimedia.org/w/api.php', params=params, timeout=90)
              if r.status_code >= 400:
                  raise RuntimeError(f'Commons API {r.status_code}: {r.text[:200]}')
              page = r.json()['query']['pages'][0]
              if page.get('missing'):
                  raise RuntimeError(f'Missing Commons file: {file_title}')
              info = page['imageinfo'][0]
              return info.get('thumburl') or info['url'], info

          def fetch_bytes(url):
              for attempt in range(1, 6):
                  r = session.get(url, timeout=120, headers={'Referer': 'https://commons.wikimedia.org/'})
                  if r.status_code == 200:
                      ctype = r.headers.get('content-type', '')
                      if not ctype.startswith('image/'):
                          raise RuntimeError(f'Expected image content, got {ctype}: {url}')
                      return r.content, ctype
                  if r.status_code == 429:
                      wait = int(r.headers.get('Retry-After', 20)) + attempt * 5
                      print(f'429 for {url}; waiting {wait}s (attempt {attempt})')
                      time.sleep(wait)
                      continue
                  raise RuntimeError(f'HTTP {r.status_code} for {url}: {r.text[:200]}')
              raise RuntimeError(f'Unable to download after retries: {url}')

          root = Path('materialized')
          root.mkdir(exist_ok=True)
          manifest = {}
          for idx, (sid, file_title) in enumerate(entries.items(), 1):
              image_url, info = resolve_image(file_title)
              print(f'[{idx}/{len(entries)}] {sid}: {image_url}')
              raw, ctype = fetch_bytes(image_url)
              with Image.open(io.BytesIO(raw)) as src:
                  src = ImageOps.exif_transpose(src).convert('RGB')
                  source_size = list(src.size)
                  fitted = ImageOps.contain(src, (768,768), method=Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (768,768), (243,245,247))
                  canvas.paste(fitted, ((768-fitted.width)//2,(768-fitted.height)//2))
                  canvas.save(root / f'{sid}.webp', 'WEBP', quality=82, method=6)
                  thumb_fit = ImageOps.contain(src, (256,256), method=Image.Resampling.LANCZOS)
                  thumb = Image.new('RGB', (256,256), (243,245,247))
                  thumb.paste(thumb_fit, ((256-thumb_fit.width)//2,(256-thumb_fit.height)//2))
                  thumb.save(root / f'{sid}.thumb.webp', 'WEBP', quality=78, method=6)
              manifest[sid] = {
                  'file_title': file_title,
                  'resolved_url': image_url,
                  'content_type': ctype,
                  'source_sha256': hashlib.sha256(raw).hexdigest(),
                  'source_size': source_size,
                  'primary': f'materialized/{sid}.webp',
                  'thumbnail': f'materialized/{sid}.thumb.webp'
              }
              time.sleep(3)
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit materialized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materialized
          git diff --cached --quiet && exit 0
          git commit -m 'assets: materialize verified chemistry images'
          git push
