name: Materialize verified chemistry images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-verified-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests
      - name: Download and normalize verified images
        run: |
          python - <<'PY'
          import io, json, hashlib
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          entries = {
            'baso4': 'https://upload.wikimedia.org/wikipedia/commons/e/e6/Baryte_%28BaSO4%29_%2813401293814%29.jpg',
            'cacl2': 'https://upload.wikimedia.org/wikipedia/commons/8/84/Calcium_chloride_CaCl2.jpg',
            'cao': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Calcium_oxide.JPG',
            'caso4': 'https://upload.wikimedia.org/wikipedia/commons/d/dd/Anhydrite_HMNH1.jpg',
            'fes2': 'https://upload.wikimedia.org/wikipedia/commons/9/9a/Pyrite_Pyrit_FeS2.jpg',
            'feso4': 'https://upload.wikimedia.org/wikipedia/commons/3/36/FeSO4_%28%D1%80%D0%B0%D1%81%D1%82%D0%B2%D0%BE%D1%80_%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%BE%D0%B3%D0%BE_%D0%BA%D1%83%D0%BF%D0%BE%D1%80%D0%BE%D1%81%D0%B0%29.jpg',
            'hgs': 'https://upload.wikimedia.org/wikipedia/commons/0/02/Cinnabar_%28HgS%29.jpg'
          }
          root = Path('materialized')
          root.mkdir(exist_ok=True)
          manifest = {}
          for sid, url in entries.items():
              r = requests.get(url, timeout=60, headers={'User-Agent':'AlchemyImageResearch/1.0'})
              r.raise_for_status()
              raw = r.content
              with Image.open(io.BytesIO(raw)) as src:
                  src = ImageOps.exif_transpose(src).convert('RGB')
                  fitted = ImageOps.contain(src, (768,768), method=Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (768,768), (243,245,247))
                  canvas.paste(fitted, ((768-fitted.width)//2,(768-fitted.height)//2))
                  canvas.save(root / f'{sid}.webp', 'WEBP', quality=82, method=6)
                  thumb_fit = ImageOps.contain(src, (256,256), method=Image.Resampling.LANCZOS)
                  thumb = Image.new('RGB', (256,256), (243,245,247))
                  thumb.paste(thumb_fit, ((256-thumb_fit.width)//2,(256-thumb_fit.height)//2))
                  thumb.save(root / f'{sid}.thumb.webp', 'WEBP', quality=78, method=6)
              manifest[sid] = {'source_sha256':hashlib.sha256(raw).hexdigest(),'url':url}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
      - name: Commit materialized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materialized
          git diff --cached --quiet && exit 0
          git commit -m 'assets: materialize verified chemistry images'
          git push
